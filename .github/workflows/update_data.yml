name: Mise à jour hebdomadaire Aviron

on:
  schedule:
    # 23:59 tous les dimanches (Heure UTC, donc 00:59 ou 01:59 en France selon l'heure d'hiver/été)
    - cron: '59 23 * * 0' 
  workflow_dispatch: # Permet d'avoir un bouton "Run workflow" sur GitHub pour le tester manuellement !

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout du code
        uses: actions/checkout@v4

      - name: 🐍 Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pandas rapidfuzz

      - name: 🕵️‍♂️ Exécution du Scrapping (Année en cours)
        run: python scrapping.py

      - name: ✨ Exécution de l'Enrichissement (Incrémental)
        run: python enrichissement.py

      - name: 🚀 Commit et Push des changements
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add base_donnees_aviron.csv base_donnees_aviron_enrichie.csv dictionnaire_clubs.json lissage_noms_ergo_log.txt
          # Le '|| echo' empêche le script de planter s'il n'y a eu aucune nouvelle course ce week-end
          git commit -m "🤖 Mise à jour auto: Scrapping & Enrichissement" || echo "Aucun changement à commiter"
          git push
